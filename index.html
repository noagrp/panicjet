<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010401">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panic Jet">
    <title>Panic Jet</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { margin: 0; background: #000; overflow: hidden; color: #0f0; font-family: 'Courier New', monospace; touch-action: none; overscroll-behavior: none; }
        canvas { display: block; width: 100vw; height: 100dvh; background: #010401; }
        #ui { position: absolute; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
        .stat-box { background: rgba(0,30,0,.95); padding: 10px 12px; border-top: 3px solid #0f0; box-shadow: 0 -5px 20px rgba(0,255,0,.4); display:flex; justify-content:space-around; align-items:center; font-size:.8em; text-transform:uppercase; flex-wrap:wrap; gap:4px 10px; }
        .weapon-tag { color:#fff; background:#222; padding:2px 6px; border-radius:4px; margin:0 3px; border:1px solid #0f0; font-size:.65em; display:inline-block; }
        #msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:clamp(1.8rem,7vw,2.5rem); display:none; color:#fff; text-shadow:0 0 20px #f00; z-index:30; text-align:center; white-space:nowrap; }
        #bossBarContainer { position:absolute; top:max(30px,calc(env(safe-area-inset-top) + 12px)); left:50%; transform:translateX(-50%); width:min(80%,760px); height:10px; background:#200; border:2px solid #f00; display:none; border-radius:5px; overflow:hidden; z-index:25; }
        #bossBar { width:100%; height:100%; background:linear-gradient(90deg,#f00,#ffaa00); transition:width .1s; }
        .round-btn { position:absolute; top:max(10px,env(safe-area-inset-top)); z-index:40; width:38px; height:38px; background:rgba(0,40,0,.82); border:2px solid #0f0; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; pointer-events:auto; color:#0f0; font:700 18px/1 'Courier New',monospace; -webkit-tap-highlight-color:transparent; }
        #audioToggle { right:max(10px,env(safe-area-inset-right)); }
        #pauseToggle { right:max(58px,calc(env(safe-area-inset-right) + 48px)); }
        #audioToggle.muted { border-color:#f00; color:#f00; }
        .overlay-screen { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); background:rgba(0,8,0,.88); text-align:center; pointer-events:auto; }
        .overlay-screen.hidden { display:none; }
        .panel { width:min(460px,100%); }
        .game-title { margin:0 0 10px; font-size:clamp(2.4rem,12vw,5rem); line-height:.95; letter-spacing:-.06em; text-shadow:0 0 24px rgba(0,255,0,.5); }
        .sub { color:#b8ffb8; margin:0 0 24px; font-size:.9rem; line-height:1.55; }
        .start-btn { min-width:180px; border:2px solid #0f0; background:#062806; color:#fff; border-radius:10px; padding:13px 18px; font:700 1rem 'Courier New',monospace; cursor:pointer; }
        .best { margin-top:16px; color:#8f8; font-size:.85rem; }
        .paused-label { font-size:clamp(2rem,10vw,4rem); margin:0 0 18px; }
        @media (max-width:520px) { .stat-box{font-size:.69em;padding:8px 7px}.round-btn{width:36px;height:36px}#pauseToggle{right:max(54px,calc(env(safe-area-inset-right) + 46px))} }
    </style>
</head>
<body>
    <button id="pauseToggle" class="round-btn" aria-label="Pause game" title="Pause">Ⅱ</button>
    <button id="audioToggle" class="round-btn" aria-label="Toggle sound" title="Sound">♪</button>
    <div id="bossBarContainer"><div id="bossBar"></div></div>
    <div id="msg">MAYDAY!</div>
    <canvas id="gameCanvas"></canvas>
    <div id="ui"><div class="stat-box"><span>LIVES:<span id="lives">9</span> ULTS:<span id="ults">3</span></span><span>SHIELDS:<span id="shields">0</span>/3 KILLS:<span id="kills">0</span></span><span>GUN:x<span id="gunLv">2</span></span><div id="weaponSlots" style="width:100%;text-align:center;margin-top:3px;">WEAPONS: NONE</div></div></div>
    <div id="startScreen" class="overlay-screen"><div class="panel"><h1 class="game-title">PANIC<br>JET</h1><p class="sub">MOVE: drag / mouse<br>AUTO-FIRE enabled · survive, steal weapons, destroy bosses</p><button id="startBtn" class="start-btn">START MISSION</button><div class="best">BEST: <span id="startBest">0</span></div></div></div>
    <div id="pauseScreen" class="overlay-screen hidden"><div class="panel"><h2 class="paused-label">PAUSED</h2><button id="resumeBtn" class="start-btn">RESUME</button></div></div>
    <div id="gameOverScreen" class="overlay-screen hidden"><div class="panel"><h2 class="game-title" style="font-size:clamp(2.2rem,10vw,4.4rem)">MISSION<br>OVER</h2><p class="sub">KILLS: <span id="finalScore">0</span><br>BEST: <span id="finalBest">0</span></p><button id="retryBtn" class="start-btn">RETRY</button></div></div>
<script>
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();let soundEnabled=false,isMuted=false;
async function enableAudio(){soundEnabled=true;if(audioCtx.state==='suspended'){try{await audioCtx.resume()}catch(_){}}}
function toggleMute(){enableAudio();isMuted=!isMuted;const btn=document.getElementById('audioToggle');btn.classList.toggle('muted',isMuted);btn.textContent=isMuted?'×':'♪'}
function playSfx(freq,type,vol=.1){if(!soundEnabled||isMuted||audioCtx.state==='suspended')return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);gain.gain.setValueAtTime(vol,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.1);osc.start();osc.stop(audioCtx.currentTime+.1)}
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');let viewW=window.innerWidth,viewH=window.innerHeight,gameScale=1,hitScale=1;
function resize(){const oldW=viewW||window.innerWidth,oldH=viewH||window.innerHeight;viewW=window.innerWidth;viewH=window.innerHeight;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.style.width=viewW+'px';canvas.style.height=viewH+'px';canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(viewH>viewW){gameScale=.6;hitScale=.65}else{gameScale=1;hitScale=1}if(typeof player!=='undefined'&&player){player.x=Math.max(25,Math.min(viewW-25,player.x*(viewW/oldW)));player.y=Math.max(40,Math.min(viewH-70,player.y*(viewH/oldH)))}}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,120));
const ENEMY_DEFS={peon:{color:'#ffffff',weapon:'straight',speed:2.2,label:'Standard',shape:'scout'},bomber:{color:'#ff00ff',weapon:'lightning',speed:1.5,label:'Heavy',shape:'titan'},sgt:{color:'#00ffff',weapon:'missile',speed:3.2,label:'Interceptor',shape:'viper'},wiz:{color:'#ffff00',weapon:'energy',speed:2,label:'Dual-Core',shape:'twin_boom'},hunt:{color:'#ff8800',weapon:'rocket',speed:2.6,label:'Predator',shape:'phantom'}};
let game={score:0,lives:9,ults:3,level:1,ultActive:false,frame:0,started:false,paused:false,over:false};let player={x:viewW/2,y:viewH-180,active:true,mainGunProj:2,shields:0,stolenWeapons:[],shootTimer:0};let enemies=[],pBullets=[],eBullets=[],powerUps=[],stars=[];let bestScore=Number(localStorage.getItem('panicjet-best')||0);resize();for(let i=0;i<80;i++)stars.push({x:Math.random()*viewW,y:Math.random()*viewH,s:Math.random()*2+1});document.getElementById('startBest').textContent=bestScore;
function drawFleet(x,y,color,scale,isEnemy,shape,isBoss=false){ctx.save();ctx.translate(x,y);if(isEnemy)ctx.rotate(Math.PI);let finalScale=(isBoss?scale*2.8:scale)*gameScale;ctx.scale(finalScale,finalScale);const dark='#111',hull=isBoss?'#8B0000':'#333';const drawPart=(path,fill)=>{ctx.fillStyle=fill;ctx.beginPath();path();ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.stroke()};if(shape==='player'||isBoss){drawPart(()=>{ctx.moveTo(-50,15);ctx.lineTo(0,-15);ctx.lineTo(50,15);ctx.lineTo(15,35);ctx.lineTo(-15,35)},color);drawPart(()=>{ctx.moveTo(0,-50);ctx.lineTo(-12,25);ctx.lineTo(12,25)},hull)}else if(shape==='scout'){drawPart(()=>{ctx.moveTo(-30,10);ctx.lineTo(0,-5);ctx.lineTo(30,10);ctx.lineTo(0,15)},color);drawPart(()=>{ctx.moveTo(0,-25);ctx.lineTo(-8,15);ctx.lineTo(8,15)},hull)}else if(shape==='titan'){drawPart(()=>{ctx.moveTo(-65,25);ctx.lineTo(0,-30);ctx.lineTo(65,25);ctx.lineTo(0,45)},color);drawPart(()=>{ctx.moveTo(0,-40);ctx.lineTo(-20,30);ctx.lineTo(20,30)},hull);drawPart(()=>{ctx.fillRect(-45,10,15,20);ctx.fillRect(30,10,15,20)},dark)}else if(shape==='viper'){drawPart(()=>{ctx.moveTo(-45,20);ctx.lineTo(0,0);ctx.lineTo(45,20);ctx.lineTo(10,30);ctx.lineTo(-10,30)},color);drawPart(()=>{ctx.moveTo(0,-55);ctx.lineTo(-6,20);ctx.lineTo(6,20)},hull)}else if(shape==='twin_boom'){drawPart(()=>{ctx.moveTo(-50,5);ctx.lineTo(0,0);ctx.lineTo(50,5);ctx.lineTo(0,15)},color);drawPart(()=>{ctx.fillRect(-25,-20,12,50);ctx.fillRect(13,-20,12,50)},hull)}else if(shape==='phantom'){drawPart(()=>{ctx.moveTo(0,-40);ctx.lineTo(-55,0);ctx.lineTo(0,40);ctx.lineTo(55,0)},color);drawPart(()=>{ctx.moveTo(0,-25);ctx.lineTo(-10,10);ctx.lineTo(10,10)},dark)}ctx.fillStyle='rgba(0,255,255,.9)';ctx.beginPath();ctx.ellipse(0,-15,5,12,0,0,7);ctx.fill();ctx.restore()}
function triggerUltimate(){if(game.ults<=0||game.ultActive)return false;game.ults--;game.ultActive=true;updateUI();playSfx(150,'sawtooth',.3);eBullets=[];enemies=enemies.filter(en=>en.isBoss);setTimeout(()=>{game.ultActive=false},1000);return true}
function update(){requestAnimationFrame(update);if(!game.started||game.paused||game.over)return;game.frame++;ctx.fillStyle=game.ultActive?'#0a2a0a':'#010401';ctx.fillRect(0,0,viewW,viewH);stars.forEach(s=>{s.y+=s.s;if(s.y>viewH){s.y=0;s.x=Math.random()*viewW}ctx.fillStyle='white';ctx.fillRect(s.x,s.y,s.s/2,s.s/2)});if(player.active){if(player.shields>0){const r=(75+Math.sin(game.frame*.1)*3)*gameScale,g=ctx.createRadialGradient(player.x-10,player.y-10,5,player.x,player.y,r);g.addColorStop(0,'rgba(200,200,200,.4)');g.addColorStop(1,'rgba(0,255,0,.6)');ctx.save();ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,r,0,7);ctx.fill();ctx.strokeStyle='rgba(0,255,0,.8)';ctx.stroke();ctx.restore()}drawFleet(player.x,player.y,'#0f0',1,false,'player');player.shootTimer++;if(player.shootTimer>8){playSfx(600,'square',.05);let spacing=15*gameScale,start=player.x-(player.mainGunProj-1)*spacing;for(let i=0;i<player.mainGunProj;i++)pBullets.push({x:start+i*spacing*2,y:player.y-50*gameScale,vx:0,vy:-22,color:'#fff',size:5*gameScale});player.stolenWeapons.forEach(w=>fire(player.x,player.y,w,true));player.shootTimer=0}}enemies.forEach((en,i)=>{if(en.isBoss){if(en.y<viewH*.18)en.y+=(en.def.speed||1.3)*gameScale;en.x+=(player.x-en.x)*.035;document.getElementById('bossBar').style.width=en.hp/en.maxHP*100+'%'}else{en.x+=(player.x-en.x)*(en.entrySide?.028:.02);en.y+=en.def.speed*(1+(game.level-1)*.4)*(viewH>viewW?.8:1)}drawFleet(en.x,en.y,en.def.color,1.1,true,en.def.shape,en.isBoss);en.shootTimer++;if(en.shootTimer>(en.isBoss?30:75)){playSfx(200,'square',.03);if(en.isBoss)en.weapons.forEach(w=>fire(en.x,en.y,w,false));else fire(en.x,en.y,en.typeKey,false);en.shootTimer=0}let hitLimit=(en.isBoss?150:65)*hitScale;if(player.active&&Math.hypot(en.x-player.x,en.y-player.y)<hitLimit){playSfx(100,'sawtooth',.2);if(player.shields>0){player.shields--;enemies.splice(i,1);updateUI()}else if(!triggerUltimate()){killPlayer();if(!en.isBoss)enemies.splice(i,1)}}if(!en.isBoss&&(en.y>viewH+200||en.x<-260||en.x>viewW+260))enemies.splice(i,1)});[pBullets,eBullets].forEach((arr,isP)=>{for(let i=arr.length-1;i>=0;i--){let b=arr[i];if(b.chase&&player.active){b.vx+=(player.x-b.x)*.009;b.vx*=.95}b.x+=b.vx;b.y+=b.vy;ctx.save();ctx.shadowBlur=15;ctx.shadowColor=b.color;if(b.isLightning){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<8;j++){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+(Math.random()-.5)*70*gameScale,b.y+(Math.random()-.5)*70*gameScale)}ctx.stroke()}else if(b.isRocket){ctx.translate(b.x,b.y);if(!isP)ctx.rotate(Math.PI);ctx.scale(gameScale,gameScale);ctx.fillStyle='#111';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-6,0);ctx.lineTo(6,0);ctx.fill();ctx.fillStyle='#bdc3c7';ctx.fillRect(-6,0,12,20)}else{ctx.fillStyle=b.color;ctx.fillRect(b.x-b.size/2,b.y,b.size,b.size*4)}ctx.restore();if(isP===0){enemies.forEach((en,ei)=>{let hitLimit=(en.isBoss?150:60)*hitScale;if(Math.hypot(b.x-en.x,b.y-en.y)<hitLimit){en.hp--;arr.splice(i,1);if(en.hp<=0){playSfx(300,'sawtooth',.1);game.score++;if(game.score>bestScore){bestScore=game.score;localStorage.setItem('panicjet-best',bestScore)}if(game.score%20===0){if(player.shields<3)player.shields++;if(player.mainGunProj<10)player.mainGunProj++;powerUps.push({x:en.x,y:en.y,type:en.typeKey,color:en.def.color})}if(en.isBoss){document.getElementById('bossBarContainer').style.display='none';game.level++;showMessage('LEVEL '+game.level+' START!',1800)}else if(game.score%50===0)spawnBoss(Math.min(game.score/50+1,4));enemies.splice(ei,1);updateUI()}}})}else if(player.active&&Math.hypot(b.x-player.x,b.y-player.y)<40*hitScale){playSfx(50,'sawtooth',.2);if(player.shields>0){player.shields--;arr.splice(i,1);updateUI()}else if(!triggerUltimate()){killPlayer();arr.splice(i,1)}}if(b.y<-250||b.y>viewH+250||b.x<-250||b.x>viewW+250)arr.splice(i,1)}});powerUps.forEach((p,i)=>{p.y+=2.2;const r=32*gameScale,g=ctx.createRadialGradient(p.x-8,p.y-8,2,p.x,p.y,r);g.addColorStop(0,'white');g.addColorStop(.5,p.color);g.addColorStop(1,'black');ctx.save();ctx.shadowBlur=30;ctx.shadowColor=p.color;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.globalAlpha=.6;drawFleet(p.x,p.y,'white',.35,false,ENEMY_DEFS[p.type].shape);ctx.restore();if(player.active&&Math.hypot(p.x-player.x,p.y-player.y)<65*hitScale){playSfx(800,'square',.1);if(player.stolenWeapons.length>=3)player.stolenWeapons.shift();player.stolenWeapons.push(p.type);powerUps.splice(i,1);updateUI()}})}
function fire(x,y,typeKey,isPlayer){const dir=isPlayer?-1:1,color=isPlayer?'#0f0':ENEMY_DEFS[typeKey].color,arr=isPlayer?pBullets:eBullets,startY=isPlayer?y-50*gameScale:y+50*gameScale;if(typeKey==='bomber')arr.push({x,y:startY,vx:0,vy:5*dir,color,size:28*gameScale,isLightning:true});else if(typeKey==='hunt')arr.push({x,y:startY,vx:0,vy:7.5*dir,color,size:12*gameScale,isRocket:true,chase:true});else arr.push({x,y:startY,vx:0,vy:(isPlayer?20:14)*dir,color,size:6*gameScale})}
function moveInput(e){if(!game.started||game.paused||game.over||!player.active)return;enableAudio();const p=e.touches?e.touches[0]:e,rect=canvas.getBoundingClientRect();player.x=Math.max(20,Math.min(viewW-20,p.clientX-rect.left));player.y=Math.max(40,Math.min(viewH-65,p.clientY-rect.top))}window.addEventListener('mousemove',moveInput);window.addEventListener('touchmove',e=>{e.preventDefault();moveInput(e)},{passive:false});
function spawnEnemy(){if(!game.started||game.paused||game.over)return;const keys=Object.keys(ENEMY_DEFS),tk=keys[Math.floor(Math.random()*keys.length)],roll=Math.random();let x,y,entrySide=false;if(roll<.52){x=40+Math.random()*Math.max(40,viewW-80);y=-70-Math.random()*70}else{entrySide=true;const fromLeft=roll<.76;x=fromLeft?-70:viewW+70;y=55+Math.random()*Math.max(80,viewH*.42-55)}enemies.push({x,y,typeKey:tk,def:ENEMY_DEFS[tk],hp:1,isBoss:false,shootTimer:Math.floor(Math.random()*28),entrySide})}
function spawnBoss(tier){const wks=Object.keys(ENEMY_DEFS);let bw=[];for(let i=0;i<tier;i++)bw.push(wks[Math.floor(Math.random()*wks.length)]);let maxHP=200*tier;enemies.push({x:viewW/2,y:-200,hp:maxHP,maxHP,isBoss:true,weapons:bw,def:{speed:1.3,color:'#f00',shape:'player'},shootTimer:0});document.getElementById('bossBarContainer').style.display='block';showMessage('WARNING',1100)}
function killPlayer(){if(!player.active)return;player.active=false;game.lives--;player.shields=0;if(player.mainGunProj>2)player.mainGunProj--;if(player.stolenWeapons.length>0)player.stolenWeapons.pop();updateUI();showMessage('MAYDAY!',1600);if(game.lives<=0)setTimeout(endGame,900);else setTimeout(()=>{player.active=true;player.x=viewW/2;player.y=Math.max(80,viewH-180)},1700)}
function showMessage(text,ms=1500){const el=document.getElementById('msg');el.innerText=text;el.style.display='block';clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>{el.style.display='none'},ms)}
function updateUI(){document.getElementById('lives').innerText=game.lives;document.getElementById('ults').innerText=game.ults;document.getElementById('shields').innerText=player.shields;document.getElementById('kills').innerText=game.score;document.getElementById('gunLv').innerText=player.mainGunProj;const slots=document.getElementById('weaponSlots');slots.innerHTML='WEAPONS: '+(player.stolenWeapons.length?player.stolenWeapons.map(w=>`<span class="weapon-tag">${ENEMY_DEFS[w].label}</span>`).join(''):'NONE')}
function resetGame(){game={score:0,lives:9,ults:3,level:1,ultActive:false,frame:0,started:true,paused:false,over:false};player={x:viewW/2,y:Math.max(80,viewH-180),active:true,mainGunProj:2,shields:0,stolenWeapons:[],shootTimer:0};enemies=[];pBullets=[];eBullets=[];powerUps=[];document.getElementById('bossBarContainer').style.display='none';document.getElementById('pauseScreen').classList.add('hidden');document.getElementById('gameOverScreen').classList.add('hidden');updateUI()}
async function startGame(){await enableAudio();resetGame();document.getElementById('startScreen').classList.add('hidden')}
function setPaused(paused){if(!game.started||game.over)return;game.paused=paused;document.getElementById('pauseScreen').classList.toggle('hidden',!paused);document.getElementById('pauseToggle').textContent=paused?'▶':'Ⅱ';if(!paused)enableAudio()}
function endGame(){game.over=true;game.paused=false;if(game.score>bestScore){bestScore=game.score;localStorage.setItem('panicjet-best',bestScore)}document.getElementById('finalScore').textContent=game.score;document.getElementById('finalBest').textContent=bestScore;document.getElementById('gameOverScreen').classList.remove('hidden');document.getElementById('pauseToggle').textContent='Ⅱ'}
document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('retryBtn').addEventListener('click',async()=>{await enableAudio();resetGame()});document.getElementById('resumeBtn').addEventListener('click',()=>setPaused(false));document.getElementById('pauseToggle').addEventListener('click',()=>setPaused(!game.paused));document.getElementById('audioToggle').addEventListener('click',toggleMute);document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.started&&!game.over)setPaused(true)});window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP')setPaused(!game.paused)});setInterval(()=>{if(game.started&&!game.paused&&!game.over&&enemies.filter(e=>!e.isBoss).length<10)spawnEnemy()},800);updateUI();update();if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script>
</body>
</html>
